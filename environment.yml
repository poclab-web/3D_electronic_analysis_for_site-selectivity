name: 3d-electronic-analysis
channels:
  - conda-forge
dependencies:
  # Numerical versions used for the accepted-model reference outputs.
  - python=3.10.17
  - numpy=2.2.6
  - pandas=2.2.3
  - scipy=1.15.2
  - scikit-learn=1.7.0
  - matplotlib-base=3.10.0
  # Workbook identity refresh and molecule/figure helpers.
  - openpyxl=3.1.5
  - rdkit=2025.03.3
  # Required only when deriving descriptors from new Gaussian calculations.
  - cclib=1.8.1
  # Kernel support for the optional run_pipeline.ipynb interface.
  - ipykernel=6.29.5
